name: Quality Check

on:
  push:
    branches: [main, env]
  pull_request:
    branches: [main, env]

jobs:
  frontend-lint-test:
    name: Frontend (Lint + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  backend-test:
    name: Backend (Test + Style + Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn validate -DskipTests
      - run: mvn test
      - run: mvn jacoco:report

  python-lint-test:
    name: Python (Lint + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install ruff pytest fastapi uvicorn pydantic-settings
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/test_pipeline.py tests/test_regression.py -v --tb=short
