server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:qa_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    root: INFO
    com.fastgpt: DEBUG
qa:
  rag:
    url: http://localhost:8000/api/qa/ask
    timeoutMs: 30000
